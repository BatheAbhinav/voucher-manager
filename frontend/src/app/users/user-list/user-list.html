@if (loading()) {
  <p>Loading…</p>
} @else if (users().length === 0) {
  <p>No users yet.</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Name</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.email }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.status }}</td>
        </tr>
      }
    </tbody>
  </table>
}
